<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teaching Space — ระบบส่งแผนการสอนและบันทึกหลังสอน | โรงเรียนบ้านห้วยตาด</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="teaching.css">
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand-wrapper">
        <img src="../img/logo-ht.png" alt="Logo" class="school-logo" onerror="this.style.display='none'">
        <div>
          <div class="brand-title">Teaching Space</div>
          <div class="brand-sub">โรงเรียนบ้านห้วยตาด</div>
        </div>
      </div>
      <div>
        <a href="../index.html" class="btn-switch-system">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>ระบบลา</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">

    <!-- User Profile Card -->
    <section class="user-card">
      <div class="user-profile">
        <div id="user-avatar-wrap">
          <div class="user-avatar-placeholder">ค</div>
        </div>
        <div>
          <div id="user-name" class="user-name">กำลังโหลดข้อมูล...</div>
          <div id="user-meta" class="user-meta">กรุณารอสักครู่</div>
        </div>
      </div>
      <div id="term-badge" class="term-badge">ภาคเรียนที่ -/-</div>
    </section>

    <!-- Navigation Tabs -->
    <nav class="tabs-nav">
      <button id="tab-loads-btn" class="tab-btn active" onclick="switchTab('loads')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>วิชาที่สอน</span>
      </button>
      <button id="tab-reflections-btn" class="tab-btn" onclick="switchTab('reflections')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span>บันทึกหลังสอน</span>
      </button>
      <button id="tab-reviews-btn" class="tab-btn" onclick="switchTab('reviews')" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>รอตรวจ</span>
        <span id="review-badge" class="tab-badge" style="display:none;">0</span>
      </button>
      <button id="tab-manage-btn" class="tab-btn" onclick="switchTab('manage')" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>จัดการวิชาการ</span>
      </button>
    </nav>

    <!-- Tab Dynamic Content -->
    <section id="tab-content">
      <!-- ข้อมูลจะถูก Render ผ่าน JavaScript -->
    </section>

  </main>

  <!-- Modal Container Root -->
  <div id="modal-root"></div>

  <!-- Loading Screen Overlay -->
  <div id="loader-overlay" class="loader-overlay" style="display:none;">
    <div class="spinner"></div>
    <div id="loader-text" style="margin-top:14px; font-weight:700; color:#1e3a8a; font-size:14px;">กำลังโหลด...</div>
  </div>

  <!-- App Script -->
  <script src="teaching.js"></script>
</body>
</html>
