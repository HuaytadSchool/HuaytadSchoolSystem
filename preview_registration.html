<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบฟอร์มลงทะเบียนครูใหม่ · โรงเรียนบ้านห้วยตาด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: 'TH Sarabun New', 'TH SarabunPSK', 'Sarabun', system-ui, sans-serif;
    }
    .reg-card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      animation: fadeUp .25s ease;
    }
    .reg-header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      padding: 28px 24px;
      text-align: center;
      color: #ffffff;
    }
    .reg-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }
    .reg-header p {
      margin: 4px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .reg-form {
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .form-row {
      display: flex;
      gap: 12px;
    }
    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dc-label {
      font-size: 13px;
      font-weight: 700;
      color: #475569;
    }
    .dc-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      font-family: inherit;
    }
    .dc-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .dc-btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, transform .1s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .dc-btn-primary:hover {
      background: #1d4ed8;
    }
    .dc-btn-primary:active {
      transform: scale(0.98);
    }
    .nav-bar {
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
    }
    .nav-link {
      padding: 6px 14px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #334155;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .nav-link:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="/leave" class="nav-link">📄 ดูแบบฟอร์มใบลา (A4)</a>
    <a href="/" class="nav-link" style="background:#2563eb;color:#fff;border-color:#2563eb">📝 แบบฟอร์มลงทะเบียนครูใหม่</a>
  </div>

  <div class="reg-card">
    <div class="reg-header">
      <div style="font-size:32px;margin-bottom:4px">🏫</div>
      <h1>ลงทะเบียนใช้งาน</h1>
      <p>ระบบจัดการการลา โรงเรียนบ้านห้วยตาด</p>
    </div>

    <form class="reg-form" onsubmit="event.preventDefault(); alert('ลงทะเบียนเรียบร้อย! ข้อมูลจะถูกส่งให้ผู้ดูแลระบบอนุมัติ');">
      <!-- Prefix & Gender -->
      <div class="form-row" style="align-items:flex-start">
        <div style="width: 140px;" class="form-group">
          <label class="dc-label">คำนำหน้า</label>
          <select id="reg-prefix" class="dc-input" onchange="handlePrefixChange()">
            <option value="นาย">นาย</option>
            <option value="นาง">นาง</option>
            <option value="นางสาว" selected>นางสาว</option>
            <option value="ว่าที่ร้อยตรี">ว่าที่ร้อยตรี</option>
            <option value="ว่าที่ร้อยตรีหญิง">ว่าที่ร้อยตรีหญิง</option>
            <option value="ดร.">ดร.</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
          <input type="text" id="reg-prefix-other" class="dc-input" placeholder="ระบุคำนำหน้า..." style="display:none;margin-top:6px">
        </div>
        <div class="form-group">
          <label class="dc-label">เพศ</label>
          <select id="reg-gender" class="dc-input" required>
            <option value="female" selected>หญิง</option>
            <option value="male">ชาย</option>
          </select>
        </div>
      </div>

      <!-- Name & Surname -->
      <div class="form-row">
        <div class="form-group">
          <label class="dc-label">ชื่อ</label>
          <input type="text" id="teacherName" required class="dc-input" value="หทัยชนก" placeholder="ชื่อจริง">
        </div>
        <div class="form-group">
          <label class="dc-label">นามสกุล</label>
          <input type="text" id="teacherSurname" required class="dc-input" value="ปรุงพณิชย์" placeholder="นามสกุล">
        </div>
      </div>

      <!-- Position & Department -->
      <div class="form-row" style="align-items:flex-start">
        <div class="form-group">
          <label class="dc-label">ตำแหน่ง</label>
          <select id="reg-pos-main" class="dc-input" onchange="handlePosChange()">
            <option value="ครู" selected>ครู</option>
            <option value="ครูผู้ช่วย">ครูผู้ช่วย</option>
            <option value="ครูอัตราจ้าง">ครูอัตราจ้าง</option>
            <option value="เจ้าหน้าที่ธุรการ">เจ้าหน้าที่ธุรการ</option>
            <option value="พี่เลี้ยงเด็กพิการ">พี่เลี้ยงเด็กพิการ</option>
            <option value="พนักงานบริการ">พนักงานบริการ / นักการภารโรง</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
          <div id="standing-wrap" style="margin-top:6px">
            <label class="dc-label" style="font-size:11.5px;color:#64748b">วิทยฐานะ</label>
            <select id="reg-pos-standing" class="dc-input" style="margin-top:2px" onchange="updateSummary()">
              <option value="none">ไม่มีวิทยฐานะ (ครู คศ.1)</option>
              <option value="c2">ครูชำนาญการ (คศ.2)</option>
              <option value="c3" selected>ครูชำนาญการพิเศษ (คศ.3)</option>
              <option value="c4">ครูเชี่ยวชาญ (คศ.4)</option>
              <option value="c5">ครูเชี่ยวชาญพิเศษ (คศ.5)</option>
            </select>
          </div>
          <input type="text" id="reg-pos-other" class="dc-input" placeholder="ระบุชื่อตำแหน่ง..." style="display:none;margin-top:6px" oninput="updateSummary()">
        </div>
        <div class="form-group">
          <label class="dc-label">กลุ่มสาระ/ฝ่าย</label>
          <select id="reg-dept-select" class="dc-input" onchange="handleDeptChange()">
            <option value="ปฐมวัย" selected>ปฐมวัย</option>
            <option value="ภาษาไทย">ภาษาไทย</option>
            <option value="คณิตศาสตร์">คณิตศาสตร์</option>
            <option value="วิทยาศาสตร์และเทคโนโลยี">วิทยาศาสตร์และเทคโนโลยี</option>
            <option value="สังคมศึกษา ศาสนา และวัฒนธรรม">สังคมศึกษา ศาสนา และวัฒนธรรม</option>
            <option value="สุขศึกษาและพลศึกษา">สุขศึกษาและพลศึกษา</option>
            <option value="ศิลปะ">ศิลปะ</option>
            <option value="การงานอาชีพ">การงานอาชีพ</option>
            <option value="ภาษาต่างประเทศ">ภาษาต่างประเทศ</option>
            <option value="วิชาการ">วิชาการ</option>
            <option value="บริหารงานทั่วไป / ธุรการ">บริหารงานทั่วไป / ธุรการ</option>
            <option value="กิจการนักเรียน">กิจการนักเรียน</option>
            <option value="บริหารงบประมาณ">บริหารงบประมาณ</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
          <input type="text" id="reg-dept-other" class="dc-input" placeholder="ระบุกลุ่มสาระ/ฝ่าย..." style="display:none;margin-top:6px">
        </div>
      </div>

      <!-- Phone & Email -->
      <div class="form-row">
        <div class="form-group">
          <label class="dc-label">เบอร์โทรศัพท์</label>
          <input type="tel" id="teacherPhone" required class="dc-input" value="0648786959" placeholder="08x-xxx-xxxx" onblur="handlePhoneFormat()">
        </div>
        <div class="form-group">
          <label class="dc-label">อีเมล (ถ้ามี)</label>
          <input type="email" id="teacherEmail" class="dc-input" placeholder="example@gmail.com">
        </div>
      </div>

      <!-- Position Preview Summary Box -->
      <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 14px;font-size:13px;color:#1e40af">
        <span style="font-weight:700">ตำแหน่งที่จะแสดงในใบลา:</span> <span id="pos-summary" style="font-weight:700;color:#2563eb">ครู วิทยฐานะครูชำนาญการพิเศษ</span>
      </div>

      <button type="submit" class="dc-btn-primary" style="margin-top:4px">ยืนยันการลงทะเบียน</button>
      <div style="font-size:12px;color:#94a3b8;text-align:center;line-height:1.5">
        ℹ️ หลังลงทะเบียน ต้องรอผู้ดูแลระบบอนุมัติก่อนเข้าใช้งานระบบ
      </div>
    </form>
  </div>

  <script>
    function handlePrefixChange() {
      const p = document.getElementById('reg-prefix').value;
      const other = document.getElementById('reg-prefix-other');
      other.style.display = (p === 'อื่นๆ') ? 'block' : 'none';
      const g = document.getElementById('reg-gender');
      if (p === 'นาย' || p === 'ว่าที่ร้อยตรี') g.value = 'male';
      if (p === 'นาง' || p === 'นางสาว' || p === 'ว่าที่ร้อยตรีหญิง') g.value = 'female';
    }

    function handlePosChange() {
      const pos = document.getElementById('reg-pos-main').value;
      const standWrap = document.getElementById('standing-wrap');
      const otherInput = document.getElementById('reg-pos-other');
      standWrap.style.display = (pos === 'ครู') ? 'block' : 'none';
      otherInput.style.display = (pos === 'อื่นๆ') ? 'block' : 'none';
      updateSummary();
    }

    function handleDeptChange() {
      const d = document.getElementById('reg-dept-select').value;
      const other = document.getElementById('reg-dept-other');
      other.style.display = (d === 'อื่นๆ') ? 'block' : 'none';
    }

    function handlePhoneFormat() {
      const el = document.getElementById('teacherPhone');
      let val = el.value.trim().replace(/[^0-9]/g, '');
      if (val.length === 9 && !val.startsWith('0')) val = '0' + val;
      el.value = val;
    }

    function updateSummary() {
      const pos = document.getElementById('reg-pos-main').value;
      const summary = document.getElementById('pos-summary');
      if (pos === 'ครู') {
        const stand = document.getElementById('reg-pos-standing').value;
        const map = {
          'none': 'ครู',
          'c2': 'ครู วิทยฐานะครูชำนาญการ',
          'c3': 'ครู วิทยฐานะครูชำนาญการพิเศษ',
          'c4': 'ครู วิทยฐานะครูเชี่ยวชาญ',
          'c5': 'ครู วิทยฐานะครูเชี่ยวชาญพิเศษ'
        };
        summary.innerText = map[stand] || 'ครู';
      } else if (pos === 'อื่นๆ') {
        summary.innerText = document.getElementById('reg-pos-other').value.trim() || 'อื่นๆ';
      } else {
        summary.innerText = pos;
      }
    }
  </script>
</body>
</html>
